<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Icon Card Gradient -->
    <linearGradient id="iconCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c44"/>
      <stop offset="50%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>

    <!-- Icon Glow / Border -->
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>

    <!-- Globe Sphere Gradient -->
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1dc7ea"/>
      <stop offset="45%" stop-color="#0072c6"/>
      <stop offset="80%" stop-color="#002b5c"/>
      <stop offset="100%" stop-color="#00142b"/>
    </radialGradient>

    <!-- Z Accent Gradient -->
    <linearGradient id="zGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>

    <!-- Text Gradient for Wordmark -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8e2ec"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Rounded-Square App Emblem (300x300, corner radius 54) -->
  <g transform="translate(50, 50)">
    <!-- Shadow & Glow -->
    <rect x="-4" y="-4" width="308" height="308" rx="60" fill="none" stroke="url(#iconBorderGrad)" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
    <!-- Card Base -->
    <rect x="0" y="0" width="300" height="300" rx="54" fill="url(#iconCardGrad)" stroke="url(#iconBorderGrad)" stroke-width="2.5"/>

    <!-- Inner Globe Sphere -->
    <circle cx="150" cy="150" r="105" fill="url(#globeGrad)"/>

    <!-- Latitude / Longitude Graticules -->
    <ellipse cx="150" cy="150" rx="105" ry="42" fill="none" stroke="#66d9ff" stroke-width="1.8" opacity="0.35"/>
    <ellipse cx="150" cy="150" rx="42" ry="105" fill="none" stroke="#66d9ff" stroke-width="1.8" opacity="0.35"/>
    <line x1="45" y1="150" x2="255" y2="150" stroke="#66d9ff" stroke-width="1.8" opacity="0.45"/>
    <line x1="150" y1="45" x2="150" y2="255" stroke="#66d9ff" stroke-width="1.8" opacity="0.45"/>

    <!-- Prominent Stylized 'Z' GIS Ribbon / Vector Ribbon -->
    <path d="M 95 105 L 205 105 L 115 195 L 205 195" fill="none" stroke="url(#zGlowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M 95 105 L 205 105 L 115 195 L 205 195" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Right: Typography Wordmark & Brand -->
  <!-- 'Z EARTH' Text -->
  <g transform="translate(410, 190)">
    <!-- Letter Z -->
    <path d="M 0,-100 L 75,-100 L 75,-78 L 26,-22 L 78,-22 L 78,0 L -3,0 L -3,-22 L 46,-78 L 0,-78 Z" fill="url(#textGrad)"/>

    <!-- Letter E -->
    <path d="M 120,-100 L 195,-100 L 195,-78 L 148,-78 L 148,-59 L 188,-59 L 188,-38 L 148,-38 L 148,-22 L 196,-22 L 196,0 L 120,0 Z" fill="url(#textGrad)"/>

    <!-- Letter A with BLUE TRIANGLE IN APEX/COUNTER -->
    <!-- Outer A Shape -->
    <path d="M 235,0 L 273,-100 L 311,0 L 286,0 L 279,-20 L 254,-20 L 247,0 Z" fill="url(#textGrad)"/>
    <!-- Approved Blue Triangle inside A -->
    <polygon points="266.5,-38 273,-68 279.5,-38" fill="#0099ff" filter="url(#glow)"/>
    <polygon points="267.5,-40 273,-65 278.5,-40" fill="#00bfff"/>

    <!-- Letter R -->
    <path d="M 335,-100 L 388,-100 Q 418,-100 418,-72 Q 418,-50 395,-44 L 422,0 L 393,0 L 370,-40 L 362,-40 L 362,0 L 335,0 Z M 362,-79 L 385,-79 Q 394,-79 394,-71 Q 394,-61 385,-61 L 362,-61 Z" fill="url(#textGrad)"/>

    <!-- Letter T -->
    <path d="M 440,-100 L 515,-100 L 515,-78 L 492,-78 L 492,0 L 464,0 L 464,-78 L 440,-78 Z" fill="url(#textGrad)"/>

    <!-- Letter H -->
    <path d="M 535,-100 L 563,-100 L 563,-59 L 602,-59 L 602,-100 L 630,-100 L 630,0 L 602,0 L 602,-38 L 563,-38 L 563,0 L 535,0 Z" fill="url(#textGrad)"/>
  </g>

  <!-- Subtitle: 'DESKTOP GIS' in tracking uppercase with cyan accent line -->
  <g transform="translate(415, 255)">
    <line x1="0" y1="-28" x2="625" y2="-28" stroke="#0099ff" stroke-width="2" opacity="0.7"/>
    <text x="0" y="0" font-family="'Segoe UI', 'SF Pro Display', 'Inter', sans-serif" font-size="28" font-weight="700" letter-spacing="9" fill="#00c8ff">DESKTOP GIS</text>
  </g>

  <!-- Credit: 'Developed by Ahmad Ibrahim' -->
  <g transform="translate(415, 298)">
    <text x="0" y="0" font-family="'Segoe UI', 'Inter', sans-serif" font-size="16" font-weight="500" fill="#8899aa">Developed by <tspan fill="#e2e8f0" font-weight="600">Ahmad Ibrahim</tspan></text>
  </g>
</svg>
