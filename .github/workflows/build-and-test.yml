name: Z EARTH build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled GIS skills and XAML markup
        run: python scripts/validate-agent-skills.py
      - name: Test reviewed intent routing and numbered agent journal (offline)
        run: |
          python -m unittest discover -s .github/tests -p "test_intent_orchestrator.py" -v
          python -m unittest discover -s .github/tests -p "test_development_journal.py" -v
          python .github/scripts/intent_router.py --plan .github/examples/intent-orchestrator/example-plan.json
          if python .github/scripts/intent_router.py --plan .github/examples/intent-orchestrator/example-plan.json --gate; then
            echo "ERROR: Unapproved example bypassed review gate"
            exit 1
          fi
      - name: Parse Cesium command JavaScript and test drawn rectangle geometry
        run: |
          node --check src/ZEarth.Globe/Assets/cesium-engine.js
          node --check src/ZEarth.Globe/Assets/rectangle-geometry.js
          node --check src/ZEarth.Globe/Assets/historical-timeline.js
          node --check src/ZEarth.Globe/Assets/graticule-labels.js
          node --check src/ZEarth.Globe/Assets/graticule-geometry.js
          node --test tests/rectangle-geometry.test.cjs tests/measurement-hud-contract.test.cjs tests/historical-timeline.test.cjs tests/graticule-labels.test.cjs tests/graticule-geometry.test.cjs tests/terrain-grid-source-contract.test.cjs tests/repo-command-contract.test.cjs tests/branding-ui-contracts.test.cjs

  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZEarth.sln
      - name: Compile (real Windows .NET 10 WPF)
        run: dotnet build ZEarth.sln -c Release --no-restore
      - name: Run unit tests, including bridge failure tests
        run: dotnet test tests/ZEarth.Tests/ZEarth.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ZEarth-ci.trx"
      - name: Build portable Windows x64 PREVIEW after all tests pass
        shell: pwsh
        run: ./scripts/create-portable-preview.ps1 -TestsAlreadyPassed
      - name: Upload Z EARTH Windows executable and complete Assets (preview only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Z-EARTH-v2.2.4-win-x64-portable-preview
          path: dist/Z EARTH-Preview/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zearth-windows-test-results
          path: |
            **/TestResults/*.trx
          if-no-files-found: ignore
