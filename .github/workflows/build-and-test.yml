name: Z EARTH build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled GIS skills and XAML markup
        run: python scripts/validate-agent-skills.py
      - name: Parse Cesium command JavaScript
        run: node --check src/ZEarth.Globe/Assets/cesium-engine.js

  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZEarth.sln
      - name: Compile (real Windows .NET 10 WPF)
        run: dotnet build ZEarth.sln -c Release --no-restore
      - name: Run unit tests, including bridge failure tests
        run: dotnet test tests/ZEarth.Tests/ZEarth.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ZEarth-ci.trx"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zearth-windows-test-results
          path: |
            **/TestResults/*.trx
          if-no-files-found: ignore
